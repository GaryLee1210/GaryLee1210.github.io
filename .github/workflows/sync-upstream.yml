name: Sync upstream research notes

on:
  schedule:
    # Requested daily time: 09:17 Beijing. GitHub may queue scheduled runs.
    - cron: '17 1 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: research-notes-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'GaryLee1210/GaryLee1210.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    outputs:
      upstream: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout latest mirror configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'

      - name: Test snapshot and publication safeguards
        run: python3 -m unittest discover -s _mirror/tests -v

      - name: Fetch complete upstream snapshot with retries
        id: source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git fetch --no-tags --depth=1 https://github.com/TingdeLiu/tingdeliu.github.io.git main; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          sha=$(git rev-parse FETCH_HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python3 _mirror/mirror.py snapshot --ref "$sha"
          python3 _mirror/mirror.py prepare

      - name: Setup pinned Sass migration tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: _mirror/styles/package-lock.json

      - name: Install and test style migration
        run: |
          test "$(node --version)" = 'v24.21.0'
          test "$(npm --version)" = '11.19.0'
          npm ci --prefix _mirror/styles --ignore-scripts --no-audit --no-fund
          node --test _mirror/styles/test-migrate.mjs

      - name: Modernize upstream Sass and verify identical CSS
        run: node _mirror/styles/migrate.mjs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Ruby and cached dependencies
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: '3.4.11'
          bundler: '4.0.23'
          bundler-cache: true
          working-directory: _mirror/build
        env:
          BUNDLE_RETRY: '3'
          BUNDLE_TIMEOUT: '30'
          BUNDLE_FROZEN: 'true'

      - name: Verify the installed toolchain and unchanged dependency locks
        run: |
          test "$(ruby -e 'print RUBY_VERSION')" = '3.4.11'
          test "$(cd _mirror/build && bundle --version)" = 'Bundler version 4.0.23'
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.13.17'
          cmp _mirror/dependencies/Gemfile.lock _mirror/build/Gemfile.lock
          git diff --exit-code -- _mirror/dependencies/Gemfile.lock _mirror/styles/package-lock.json

      - name: Build candidate without changing the published site
        working-directory: _mirror/build
        shell: bash
        run: |
          set -euo pipefail
          bundle exec jekyll build --config _config.yml,_mirror.yml --strict_front_matter 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"
          if grep -Eq 'DEPRECATION WARNING|repetitive deprecation warnings' "$RUNNER_TEMP/jekyll-build.log"; then
            echo '::error::Sass deprecations remain in the Jekyll build; review the new upstream stylesheet before publishing.'
            exit 1
          fi
        env:
          JEKYLL_ENV: production
          BUNDLE_FROZEN: 'true'

      - name: Apply attribution and validate publication
        run: python3 _mirror/mirror.py finalize
        env:
          MIRROR_PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload validated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _mirror/build/_site

      - name: Save only the validated snapshot without force pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 _mirror/mirror.py stage
          if ! git diff --cached --quiet; then
            git commit -m 'Sync validated upstream snapshot [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 10))
            done
          fi
          echo '### Validated snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upstream: ${{ steps.source.outputs.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Personal configuration and overrides retained; no Git merge or force push.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a blocked candidate
        if: failure()
        run: |
          echo '### Candidate was not deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The previous Pages deployment remains available. Fix the reported build/configuration/network error and rerun; failures are not hidden.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify the live upstream revision
        env:
          EXPECTED_REVISION: ${{ needs.validate.outputs.upstream }}
          EXPECTED_PUBLICATION: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            actual=$(curl --fail --silent --show-error --max-time 20 \
              "https://garylee1210.github.io/mirror-status.json?run=$GITHUB_RUN_ID&attempt=$attempt" \
              | jq -r '[.upstream_revision, .publication_id] | join(" ")' || true)
            if [ "$actual" = "$EXPECTED_REVISION $EXPECTED_PUBLICATION" ]; then
              echo "Live website and this publication verified: $actual" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Pages deployed, but the live revision could not yet be verified.'
          exit 1
