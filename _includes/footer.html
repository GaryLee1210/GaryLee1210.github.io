<!-- 插入一系列svg的按钮 -->
{% include svg-icons.html %}

<!-- 插入添加的文字 -->
{% if site.footer-text %}
<p>{{ site.footer-text }}</p>
{% endif %}


<!-- 载入GitHub按钮库 -->
<script async defer src="https://buttons.github.io/buttons.js"></script>
<!-- Star按钮 -->
<a class="github-button"
  href="https://github.com/{{ site.repository }}"
  data-icon="octicon-star"
  data-size="large"
  data-show-count="true"
  aria-label="Star it on GitHub">Star on Github</a>

<p>学习镜像 · 原文作者 <a href="{{ site.source_url }}">{{ site.content_author }}</a><br>
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · 保留原文，调整站点配置与链接</p>
