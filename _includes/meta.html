<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="{% if page.layout == 'post' %}{{ site.content_author | escape }}{% else %}{{ site.name | escape }}{% endif %}">
<meta name="keywords" content="Robotics, VLN, Embodied AI, Deep Learning, Research Notes">
<meta name="description" content="{{ site.name | escape }} 的 AI 与机器人研究笔记学习镜像；原文作者 {{ site.content_author | escape }}，原创文字依 CC BY 4.0 转载。{% if page.title %} {{ page.title | escape }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.name | escape }} · {{ site.description | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.name | escape }} · Research Notes{% endif %}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.name | escape }} · Research Notes{% endif %}">
<meta property="og:description" content="AI 与机器人研究笔记学习镜像 · 原文作者 {{ site.content_author | escape }} · CC BY 4.0">
<meta property="og:image" content="{{ site.avatar | absolute_url }}">
<meta property="og:locale" content="zh_CN">
